name: Build NuvioBridge APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/local/nuviobridge
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NuvioBridge"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.local.nuviobridge'
              compileSdk 34
              defaultConfig {
                  applicationId "com.local.nuviobridge"
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <queries>
                  <package android:name="com.nuvio.tv" />
                  <package android:name="com.nuvio.tv.lite" />
                  <package android:name="io.gh.reisxd.tizentube.cobalt" />
                  <package android:name="com.liskovsoft.smarttubetv.beta" />
                  <package android:name="com.liskovsoft.smarttubetv" />
              </queries>
              <application
                  android:label="NuvioBridge"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BridgeAccessibilityService"
                      android:exported="true"
                      android:label="NuvioBridge Interceptor"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeViewClicked|typeViewSelected|typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/accessibility_desc" />
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">NuvioBridge</string>
              <string name="accessibility_desc">Routes Android TV launcher clicks into Nuvio and TizenTube/SmartTube.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/local/nuviobridge/MainActivity.kt
          package com.local.nuviobridge

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("bridge_prefs", MODE_PRIVATE)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(80, 60, 80, 60)
                      setBackgroundColor(Color.parseColor("#121212"))
                  }
                  val title = TextView(this).apply {
                      text = "NuvioBridge Setup"
                      textSize = 26f
                      setTextColor(Color.WHITE)
                      setPadding(0, 0, 0, 16)
                  }
                  val apiKeyInput = EditText(this).apply {
                      hint = "Enter TMDB v3 API Key"
                      setText(prefs.getString("tmdb_key", ""))
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.GRAY)
                      isSingleLine = true
                  }
                  val saveBtn = Button(this).apply {
                      text = "1. Save TMDB API Key"
                      setOnClickListener {
                          prefs.edit().putString("tmdb_key", apiKeyInput.text.toString().trim()).apply()
                          Toast.makeText(this@MainActivity, "TMDB Key Saved!", Toast.LENGTH_SHORT).show()
                      }
                  }
                  val accessBtn = Button(this).apply {
                      text = "2. Open Accessibility Settings (Enable Service)"
                      setOnClickListener {
                          try {
                              startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                          } catch (e: Exception) {
                              startActivity(Intent(Settings.ACTION_SETTINGS))
                          }
                      }
                  }
                  layout.addView(title)
                  layout.addView(apiKeyInput)
                  layout.addView(saveBtn)
                  layout.addView(accessBtn)
                  setContentView(layout)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/local/nuviobridge/BridgeAccessibilityService.kt
          package com.local.nuviobridge

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Handler
          import android.os.Looper
          import android.util.Log
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Toast
          import org.json.JSONObject
          import java.net.URL
          import java.net.URLEncoder
          import java.util.concurrent.Executors

          class BridgeAccessibilityService : AccessibilityService() {
              private val executor = Executors.newSingleThreadExecutor()
              private val mainHandler = Handler(Looper.getMainLooper())
              private var lastTitle = ""
              private var lastTime = 0L

              private val prefs by lazy { getSharedPreferences("bridge_prefs", MODE_PRIVATE) }
              private val tmdbApiKey: String get() = prefs.getString("tmdb_key", "") ?: ""

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  val pkg = event.packageName?.toString() ?: ""

                  // Ignore our own app, settings, and internal system system-ui overlays
                  if (pkg == packageName || pkg == "com.android.settings" || pkg == "com.android.systemui") return

                  val node = event.source ?: rootInActiveWindow ?: return
                  val title = findCandidateTitle(node) ?: return

                  val now = System.currentTimeMillis()
                  if (title == lastTitle && (now - lastTime) < 3500) return

                  // Catch trigger when details window or card opens
                  if (event.eventType == AccessibilityEvent.TYPE_VIEW_CLICKED ||
                      event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {

                      // If we are on the details screen or launcher
                      if (title.length > 1 && !isIgnoredWord(title)) {
                          lastTitle = title
                          lastTime = now

                          if (tmdbApiKey.isBlank()) {
                              showToast("Set TMDB Key in NuvioBridge app!")
                              return
                          }

                          showToast("Bridging '$title' -> Nuvio")
                          performGlobalAction(GLOBAL_ACTION_BACK)
                          resolveAndLaunch(title)
                      }
                  }
              }

              private fun findCandidateTitle(node: AccessibilityNodeInfo?): String? {
                  if (node == null) return null
                  val text = node.text?.toString()?.trim()
                  val desc = node.contentDescription?.toString()?.trim()

                  val candidate = when {
                      !desc.isNullOrEmpty() && desc.length > 2 && !isIgnoredWord(desc) -> clean(desc)
                      !text.isNullOrEmpty() && text.length > 2 && !isIgnoredWord(text) -> clean(text)
                      else -> null
                  }

                  if (candidate != null) return candidate

                  for (i in 0 until node.childCount) {
                      val child = findCandidateTitle(node.getChild(i))
                      if (child != null) return child
                  }
                  return null
              }

              private fun clean(raw: String): String {
                  return raw.split("•", "\n", " - ", " | ", ", 20", ", 19").firstOrNull()?.trim() ?: raw
              }

              private fun isIgnoredWord(w: String): Boolean {
                  val ignored = setOf(
                      "Home", "Search", "Apps", "Library", "Settings", "Profile",
                      "Watchlist", "For you", "Movies", "Shows", "Live", "Play", "Watch",
                      "Details", "Overview", "More info", "Trailer", "OK", "Cancel"
                  )
                  return ignored.any { it.equals(w, ignoreCase = true) }
              }

              private fun resolveAndLaunch(query: String) {
                  executor.execute {
                      try {
                          val encoded = URLEncoder.encode(query, "UTF-8")
                          val url = "https://api.themoviedb.org/3/search/multi?api_key=$tmdbApiKey&query=$encoded&include_adult=false"
                          val json = JSONObject(URL(url).readText())
                          val results = json.optJSONArray("results") ?: return@execute
                          if (results.length() == 0) return@execute

                          var match: JSONObject? = null
                          for (i in 0 until results.length()) {
                              val item = results.getJSONObject(i)
                              val type = item.optString("media_type")
                              if (type == "movie" || type == "tv") {
                                  match = item
                                  break
                              }
                          }
                          if (match == null) return@execute

                          val id = match.getInt("id")
                          val mediaType = match.getString("media_type")
                          val nuvioType = if (mediaType == "tv") "series" else "movie"

                          val extUrl = "https://api.themoviedb.org/3/$mediaType/$id/external_ids?api_key=$tmdbApiKey"
                          val extJson = JSONObject(URL(extUrl).readText())
                          val imdbId = extJson.optString("imdb_id", "")
                          val targetId = if (imdbId.startsWith("tt")) imdbId else "tmdb:$id"

                          mainHandler.post { launchNuvio(nuvioType, targetId) }
                      } catch (e: Exception) {
                          Log.e("NuvioBridge", "Error", e)
                      }
                  }
              }

              private fun launchNuvio(type: String, id: String) {
                  val targets = listOf("com.nuvio.tv", "com.nuvio.tv.lite")
                  val installed = targets.firstOrNull { isInstalled(it) }

                  val schemes = listOf("nuvio:///detail/$type/$id", "stremio:///detail/$type/$id")
                  for (uri in schemes) {
                      try {
                          val intent = Intent(Intent.ACTION_VIEW, Uri.parse(uri)).apply {
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                              if (installed != null) setPackage(installed)
                          }
                          startActivity(intent)
                          return
                      } catch (_: Exception) {}
                  }
              }

              private fun isInstalled(pkg: String): Boolean {
                  return try {
                      packageManager.getPackageInfo(pkg, 0)
                      true
                  } catch (_: PackageManager.NameNotFoundException) {
                      false
                  }
              }

              private fun showToast(msg: String) {
                  mainHandler.post { Toast.makeText(applicationContext, msg, Toast.LENGTH_SHORT).show() }
              }

              override fun onInterrupt() {}
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: NuvioBridge-APK
          path: app/build/outputs/apk/release/*.apk
          

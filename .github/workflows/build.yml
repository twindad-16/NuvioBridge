name: Build NuvioBridge APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/local/nuviobridge
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NuvioBridge"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.local.nuviobridge'
              compileSdk 34
              defaultConfig {
                  applicationId "com.local.nuviobridge"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <queries>
                  <package android:name="com.nuvio.tv" />
                  <package android:name="com.nuvio.tv.lite" />
                  <package android:name="io.gh.reisxd.tizentube.cobalt" />
                  <package android:name="com.liskovsoft.smarttubetv.beta" />
                  <package android:name="com.liskovsoft.smarttubetv" />
              </queries>
              <application
                  android:label="NuvioBridge"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BridgeAccessibilityService"
                      android:exported="true"
                      android:label="NuvioBridge Interceptor"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeViewClicked|typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/accessibility_desc"
              android:packageNames="com.google.android.tvlauncher,com.google.android.apps.tv.launcherx,com.spocky.projengmenu,com.google.android.katniss" />
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">NuvioBridge</string>
              <string name="accessibility_desc">Intercepts Android TV / Google TV / Projectivy home screen recommendation clicks and routes them directly into Nuvio and TizenTube/SmartTube.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/local/nuviobridge/MainActivity.kt
          package com.local.nuviobridge

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("bridge_prefs", MODE_PRIVATE)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(80, 60, 80, 60)
                      setBackgroundColor(Color.parseColor("#121212"))
                  }
                  val title = TextView(this).apply {
                      text = "NuvioBridge Setup"
                      textSize = 26f
                      setTextColor(Color.WHITE)
                      setPadding(0, 0, 0, 16)
                  }
                  val subTitle = TextView(this).apply {
                      text = "Routes Launcher clicks -> Nuvio & TizenTube/SmartTube"
                      textSize = 16f
                      setTextColor(Color.LTGRAY)
                      setPadding(0, 0, 0, 32)
                  }
                  val apiKeyInput = EditText(this).apply {
                      hint = "Enter free TMDB v3 API Key (themoviedb.org)"
                      setText(prefs.getString("tmdb_key", ""))
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.GRAY)
                      isSingleLine = true
                  }
                  val confirmToggle = Switch(this).apply {
                      text = "Double-Click Confirmation Mode (Click once to arm, click again within 4s to open Nuvio)"
                      setTextColor(Color.WHITE)
                      isChecked = prefs.getBoolean("double_click_mode", false)
                      setPadding(0, 24, 0, 24)
                      setOnCheckedChangeListener { _, isChecked ->
                          prefs.edit().putBoolean("double_click_mode", isChecked).apply()
                      }
                  }
                  val saveBtn = Button(this).apply {
                      text = "1. Save TMDB API Key"
                      setOnClickListener {
                          prefs.edit().putString("tmdb_key", apiKeyInput.text.toString().trim()).apply()
                          Toast.makeText(this@MainActivity, "TMDB Key Saved!", Toast.LENGTH_SHORT).show()
                      }
                  }
                  val accessBtn = Button(this).apply {
                      text = "2. Open Accessibility Settings (Enable NuvioBridge)"
                      setOnClickListener {
                          try {
                              startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                          } catch (e: Exception) {
                              startActivity(Intent(Settings.ACTION_SETTINGS))
                          }
                      }
                  }
                  layout.addView(title)
                  layout.addView(subTitle)
                  layout.addView(apiKeyInput)
                  layout.addView(confirmToggle)
                  layout.addView(saveBtn)
                  layout.addView(accessBtn)
                  setContentView(layout)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/local/nuviobridge/BridgeAccessibilityService.kt
          package com.local.nuviobridge

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Handler
          import android.os.Looper
          import android.util.Log
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Toast
          import org.json.JSONObject
          import java.net.URL
          import java.net.URLEncoder
          import java.util.concurrent.Executors

          class BridgeAccessibilityService : AccessibilityService() {
              private val executor = Executors.newSingleThreadExecutor()
              private val mainHandler = Handler(Looper.getMainLooper())
              private var lastTriggeredTitle = ""
              private var lastTriggerTime = 0L
              private var armedTitle = ""
              private var armedTime = 0L

              private val prefs by lazy { getSharedPreferences("bridge_prefs", MODE_PRIVATE) }
              private val tmdbApiKey: String get() = prefs.getString("tmdb_key", "") ?: ""
              private val doubleClickMode: Boolean get() = prefs.getBoolean("double_click_mode", false)

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  if (event.eventType == AccessibilityEvent.TYPE_VIEW_CLICKED) {
                      val clickedNode = event.source ?: return
                      val extractedText = extractTitleFromNode(clickedNode) ?: return
                      if (isIgnoredSystemLabel(extractedText)) return

                      val now = System.currentTimeMillis()
                      if (doubleClickMode) {
                          if (extractedText != armedTitle || (now - armedTime) > 4500) {
                              armedTitle = extractedText
                              armedTime = now
                              showToast("Click '$extractedText' again within 4s to open in Nuvio")
                              return
                          }
                          armedTitle = ""
                      } else {
                          if (extractedText == lastTriggeredTitle && (now - lastTriggerTime) < 3000) return
                      }

                      lastTriggeredTitle = extractedText
                      lastTriggerTime = now

                      if (tmdbApiKey.isBlank()) {
                          showToast("NuvioBridge: Please set your TMDB API key in the NuvioBridge app first!")
                          return
                      }

                      if (extractedText.contains("Trailer", ignoreCase = true) ||
                          extractedText.contains("YouTube", ignoreCase = true)) {
                          val parentTitle = findParentMediaTitle(rootInActiveWindow)
                          if (!parentTitle.isNullOrBlank()) {
                              performGlobalAction(GLOBAL_ACTION_BACK)
                              showToast("Opening Trailer in TizenTube/SmartTube: $parentTitle")
                              resolveAndLaunchTrailer(parentTitle)
                              return
                          }
                      }

                      showToast("NuvioBridge -> $extractedText")
                      performGlobalAction(GLOBAL_ACTION_BACK)
                      resolveAndLaunchNuvio(extractedText)
                  }
              }

              private fun extractTitleFromNode(node: AccessibilityNodeInfo?): String? {
                  if (node == null) return null
                  node.contentDescription?.toString()?.trim()?.takeIf { it.isNotEmpty() }?.let { return cleanTitle(it) }
                  node.text?.toString()?.trim()?.takeIf { it.isNotEmpty() }?.let { return cleanTitle(it) }
                  for (i in 0 until node.childCount) {
                      val childTitle = extractTitleFromNode(node.getChild(i))
                      if (!childTitle.isNullOrEmpty()) return childTitle
                  }
                  return null
              }

              private fun cleanTitle(raw: String): String {
                  return raw.split("•", "\n", " - ", " | ", ", 20", ", 19").firstOrNull()?.trim() ?: raw
              }

              private fun isIgnoredSystemLabel(label: String): Boolean {
                  val ignored = setOf(
                      "Home", "Search", "Apps", "Library", "Settings", "Profile",
                      "Watchlist", "For you", "Movies", "Shows", "Live", "Continue watching",
                      "See all", "More info", "Back", "Cancel", "OK"
                  )
                  return ignored.any { it.equals(label, ignoreCase = true) } || label.length < 2
              }

              private fun findParentMediaTitle(root: AccessibilityNodeInfo?): String? {
                  if (root == null) return null
                  if (root.className?.contains("TextView") == true && !root.text.isNullOrBlank()) {
                      val t = root.text.toString().trim()
                      if (!isIgnoredSystemLabel(t) && !t.contains("Trailer", true)) return cleanTitle(t)
                  }
                  for (i in 0 until root.childCount) {
                      findParentMediaTitle(root.getChild(i))?.let { return it }
                  }
                  return null
              }

              private fun resolveAndLaunchNuvio(rawQuery: String) {
                  executor.execute {
                      try {
                          val encoded = URLEncoder.encode(rawQuery, "UTF-8")
                          val searchUrl = "https://api.themoviedb.org/3/search/multi?api_key=$tmdbApiKey&query=$encoded&include_adult=false"
                          val searchJson = JSONObject(URL(searchUrl).readText())
                          val results = searchJson.optJSONArray("results")
                          if (results == null || results.length() == 0) {
                              showToast("No TMDB match for '$rawQuery'")
                              return@execute
                          }
                          var match: JSONObject? = null
                          for (i in 0 until results.length()) {
                              val item = results.getJSONObject(i)
                              val type = item.optString("media_type")
                              if (type == "movie" || type == "tv") {
                                  match = item
                                  break
                              }
                          }
                          if (match == null) return@execute
                          val tmdbId = match.getInt("id")
                          val mediaType = match.getString("media_type")
                          val nuvioType = if (mediaType == "tv") "series" else "movie"
                          val extUrl = "https://api.themoviedb.org/3/$mediaType/$tmdbId/external_ids?api_key=$tmdbApiKey"
                          val extJson = JSONObject(URL(extUrl).readText())
                          val imdbId = extJson.optString("imdb_id", "")
                          val targetId = if (imdbId.startsWith("tt")) imdbId else "tmdb:$tmdbId"
                          mainHandler.post { launchInNuvio(nuvioType, targetId) }
                      } catch (e: Exception) {
                          Log.e("NuvioBridge", "Lookup failed", e)
                          showToast("TMDB Lookup Error: ${e.localizedMessage}")
                      }
                  }
              }

              private fun launchInNuvio(type: String, id: String) {
                  val nuvioPackages = listOf("com.nuvio.tv", "com.nuvio.tv.lite")
                  val installedPkg = nuvioPackages.firstOrNull { isPackageInstalled(it) }
                  val schemes = listOf("nuvio:///detail/$type/$id", "stremio:///detail/$type/$id")
                  for (uriString in schemes) {
                      try {
                          val intent = Intent(Intent.ACTION_VIEW, Uri.parse(uriString)).apply {
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                              if (installedPkg != null) setPackage(installedPkg)
                          }
                          startActivity(intent)
                          return
                      } catch (_: Exception) {}
                  }
                  showToast("Could not deep link into Nuvio. Make sure Nuvio is installed.")
              }

              private fun resolveAndLaunchTrailer(title: String) {
                  executor.execute {
                      try {
                          val encoded = URLEncoder.encode(title, "UTF-8")
                          val searchUrl = "https://api.themoviedb.org/3/search/multi?api_key=$tmdbApiKey&query=$encoded"
                          val results = JSONObject(URL(searchUrl).readText()).optJSONArray("results") ?: return@execute
                          if (results.length() == 0) return@execute
                          val first = results.getJSONObject(0)
                          val id = first.getInt("id")
                          val mediaType = first.optString("media_type", "movie")
                          val videosUrl = "https://api.themoviedb.org/3/$mediaType/$id/videos?api_key=$tmdbApiKey"
                          val videos = JSONObject(URL(videosUrl).readText()).optJSONArray("results") ?: return@execute
                          var youtubeKey: String? = null
                          for (i in 0 until videos.length()) {
                              val v = videos.getJSONObject(i)
                              if (v.optString("site") == "YouTube" && v.optString("type") == "Trailer") {
                                  youtubeKey = v.optString("key")
                                  break
                              }
                          }
                          if (youtubeKey != null) {
                              mainHandler.post { launchYouTubeVideo(youtubeKey) }
                          }
                      } catch (e: Exception) {
                          Log.e("NuvioBridge", "Trailer lookup failed", e)
                      }
                  }
              }

              private fun launchYouTubeVideo(videoId: String) {
                  val ytUrl = "https://www.youtube.com/watch?v=$videoId"
                  val candidates = listOf(
                      "io.gh.reisxd.tizentube.cobalt",
                      "com.liskovsoft.smarttubetv.beta",
                      "com.liskovsoft.smarttubetv"
                  )
                  val targetPkg = candidates.firstOrNull { isPackageInstalled(it) }
                  try {
                      val intent = Intent(Intent.ACTION_VIEW, Uri.parse(ytUrl)).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          if (targetPkg != null) setPackage(targetPkg)
                      }
                      startActivity(intent)
                  } catch (e: Exception) {
                      showToast("Failed to launch TizenTube / SmartTube")
                  }
              }

              private fun isPackageInstalled(packageName: String): Boolean {
                  return try {
                      packageManager.getPackageInfo(packageName, 0)
                      true
                  } catch (_: PackageManager.NameNotFoundException) {
                      false
                  }
              }

              private fun showToast(msg: String) {
                  mainHandler.post { Toast.makeText(applicationContext, msg, Toast.LENGTH_SHORT).show() }
              }

              override fun onInterrupt() {}
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: NuvioBridge-APK
          path: app/build/outputs/apk/release/*.apk
